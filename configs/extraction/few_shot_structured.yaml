method: few_shot_structured
prompt_path: prompts/extraction/few_shot_structured.txt

llm:
    temperature: 0.0
    max_tokens: 600
    top_p: 1.0
    timeout: 60
    max_retries: 2
    retry_sleep_seconds: 2

few_shot:
    n_examples: 3
    examples_path: sample_data/extraction/fewnerd_few_shot_examples.csv

dataset:
    input_path: data/extraction/processed/fewnerd_location_test_1000.csv
    labels_path: null

runtime:
    retry_on_malformed_json: 1

debug:
    max_rows: 100
